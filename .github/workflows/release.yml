name: Build APK

# The Gradle project lives in the vitals/ subfolder, so every run step uses it
# as its working directory.
on:
  push:
    branches: [main, master]
    # Both cases: a tag typed as V1.2.0 would otherwise be silently ignored,
    # publishing a release with no APK attached and no failed run to show why.
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: vitals

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Makes sure sdkmanager is present and licences are accepted, so AGP can
      # fetch compileSdk 36 rather than failing on a runner image that lacks it.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # GitHub secrets hold text, not files, so the keystore travels base64-encoded.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "Keystore restored ($(stat -c%s app/release.jks) bytes)"

      # Same file the app reads locally. Missing keys are fine - the voice and
      # label features simply stay inactive.
      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          USDA_API_KEY=${{ secrets.USDA_API_KEY }}
          EOF

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Monotonic, so every build installs over the previous one.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt

      # Full logs and job summaries need a GitHub login. Annotations do not,
      # so the failure is re-emitted as error annotations on the run page.
      - name: Report failure as annotations
        if: failure()
        run: |
          if [ ! -f build-log.txt ]; then
            echo "::error title=No build log::Gradle produced no output - the job failed before the build step."
            exit 0
          fi
          : > err.txt
          # Compiler errors appear BEFORE the FAILURE block, so collect both.
          grep -E "^e: |^error:|^w: .*error|Unresolved reference|Could not (find|resolve|download)|requires .* or higher|No matching variant" build-log.txt | head -24 >> err.txt || true
          awk '/^FAILURE: /{f=1} f' build-log.txt | head -30 >> err.txt || true
          if [ ! -s err.txt ]; then
            tail -n 60 build-log.txt > err.txt
          fi
          n=0
          while [ "$n" -lt 8 ]; do
            start=$(( n * 6 + 1 ))
            end=$(( n * 6 + 6 ))
            chunk=$(sed -n "${start},${end}p" err.txt)
            if [ -z "$chunk" ]; then break; fi
            enc=$(printf '%s' "$chunk" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build failure part $n::${enc}"
            n=$(( n + 1 ))
          done

      # Full logs need a GitHub login to read. The run summary does not, so on
      # failure the tail of the build output is copied there where it can be
      # read (and pasted) without signing in. GitHub masks secret values.
      - name: Show failure in the run summary
        if: failure()
        run: |
          {
            echo '## Build failed'
            echo ''
            echo '```'
            tail -n 250 build-log.txt 2>/dev/null || echo 'No build-log.txt - the build never started.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: vitals/build-log.txt
          if-no-files-found: ignore

      - name: Upload APK as an artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vitals-apk
          path: vitals/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vitals/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f app/release.jks
