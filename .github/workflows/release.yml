name: Build APK

# The Gradle project lives in the vitals/ subfolder, so every build step runs
# with that as its working directory.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: vitals

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Makes sure sdkmanager is present and licences are accepted, so AGP can
      # fetch compileSdk 36 rather than failing on a runner image that lacks it.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: vitals

      # GitHub secrets hold text, not files, so the keystore travels base64-encoded.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty. Add it under Settings then Secrets and variables then Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "Keystore restored ($(stat -c%s app/release.jks) bytes)"

      # Same file the app reads locally. Missing keys are fine - the voice and
      # label features simply stay inactive.
      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          USDA_API_KEY=${{ secrets.USDA_API_KEY }}
          EOF

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Monotonic, so every build installs over the previous one.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      # Available on every build, tagged or not, so you can grab an APK without
      # cutting a release.
      - name: Upload APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitals-apk
          path: vitals/app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vitals/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f app/release.jks
